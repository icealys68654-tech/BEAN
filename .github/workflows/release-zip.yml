name: BEAN source ZIP
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
permissions:
  contents: read
jobs:
  source-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and validate
        run: |
          npm install
          npm run build
          npm test
          python -m unittest discover -s ops/windows/ids/tests -v
      - name: Package source archive
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=BEAN/ HEAD -o dist/BEAN-source.zip
          sha256sum dist/BEAN-source.zip > dist/BEAN-source.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: BEAN-source-\${{ github.ref_name }}
          path: |
            dist/BEAN-source.zip
            dist/BEAN-source.zip.sha256
