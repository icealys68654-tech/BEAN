name: BEAN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Build Go command-line tools
        run: |
          mkdir -p dist/bin
          cd packages/env-guard && go build -o ../../dist/bin/env-guard ./cmd/env-guard
          cd ../smoke-probe && go build -o ../../dist/bin/smoke-probe ./cmd/smoke-probe
